; Isolated native CLI configuration; child @php/PHPStan processes inherit PHPRC.
extension_dir = "${LPS_PHP_NATIVE_ROOT}/usr/lib/php/20230831"
memory_limit = 1536M
date.timezone = UTC
display_errors = stderr
error_reporting = E_ALL
extension = ctype
extension = curl
extension = dom
extension = fileinfo
extension = iconv
extension = mbstring
extension = phar
; posix supplies posix_isatty(); without it PHPCS falls back to trim(shell_exec("which tty")),
; which passes null to trim() and emits a PHP 8.3 deprecation.
extension = posix
extension = simplexml
extension = tokenizer
extension = xml
extension = xmlreader
extension = xmlwriter
extension = zip
