# Include inside the institution-managed server {} block, after configuring its root.
# Install security-static-headers.conf beside the main nginx.conf.
server_tokens off;
proxy_hide_header X-Powered-By;
fastcgi_hide_header X-Powered-By;
limit_req zone=lps_auth burst=20 nodelay;
limit_req_status 429;
access_log logs/lps-access.log lps_privacy;
error_page 403 = @lps_forbidden;
error_page 404 = @lps_not_found;
error_page 429 = @lps_throttled;
location @lps_forbidden { include security-static-headers.conf; return 403; }
location @lps_not_found { include security-static-headers.conf; return 404; }
location @lps_throttled { include security-static-headers.conf; return 429; }
location = /xmlrpc.php { return 403; }
location ~* ^/(?:readme\.html|license\.txt|wp-admin/(?:install|setup-config|upgrade)\.php)$ { return 403; }
location ~ /\. { deny all; }
location ~* (?:/tests/|/includes/|debug|\.log$|\.sql$|\.sqlite$) { deny all; }
location ~* ^/wp-content/uploads/.*\.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh|html?|svg|js)(?:\.|$) { deny all; }
location ~* ^/wp-content/uploads/.*\.(?:pdf|vtt)$ {
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition attachment always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
    try_files $uri =404;
}
location ~* \.(?:css|js|woff2?|png|jpe?g|webp|avif|ico|mp4|webm|mp3|ogg|oga)$ {
    include security-static-headers.conf;
    try_files $uri =404;
}
