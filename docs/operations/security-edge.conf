# Include in the institution-managed Nginx http context.
# Origin must be firewalled; do not trust arbitrary X-Forwarded-For.
map $uri $lps_auth_key {
    default "";
    ~^/wp-login\.php$ $binary_remote_addr;
}
limit_req_zone $lps_auth_key zone=lps_auth:10m rate=5r/m;
log_format lps_privacy '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

